name: Update Secret Value

# Manually update a single key inside this service's consolidated AWS Secrets
# Manager secret ("<env>/SERVICE_TOKEN/app"), then force a new ECS deployment so
# the running tasks pick up the new value.
#
# OIDC constraint (same as ci.yml): the AWS role trust policy keys off the git
# branch, so this must be dispatched from the 'dev' branch (or 'prod' once the
# workflow is promoted there). The environment input must match the branch.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
      parameter_name:
        description: 'Secret key to update (must already exist in the secret)'
        required: true
        type: string
      parameter_value:
        description: 'New value for the key'
        required: true
        type: string

# One secret write at a time per environment. Never cancel an in-flight write.
concurrency:
  group: update-secret-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  # The ONLY per-repo difference. Secret id is "<environment>/<SERVICE_TOKEN>/app".
  SERVICE_TOKEN: backend

jobs:
  update:
    name: Update ${{ github.event.inputs.parameter_name }} (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write   # Required for OIDC token request
      contents: read

    steps:
      # ── 1. Guard: branch must be dev/prod and match the chosen environment ──
      - name: Validate dispatch branch matches environment
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [ "$REF_NAME" != "dev" ] && [ "$REF_NAME" != "prod" ]; then
            echo "❌ Dispatch must run from the 'dev' or 'prod' branch (OIDC trust policy)."
            echo "   Current branch: $REF_NAME"
            exit 1
          fi
          if [ "$REF_NAME" != "$TARGET_ENV" ]; then
            echo "❌ environment '$TARGET_ENV' must match the branch '$REF_NAME'."
            echo "   Dispatching the '$TARGET_ENV' environment from the '$REF_NAME' branch"
            echo "   would fail OIDC (sts:AssumeRoleWithWebIdentity AccessDenied)."
            exit 1
          fi

      # ── 2. Keep the new value out of the logs ───────────────────────────────
      - name: Mask value in logs
        env:
          VALUE: ${{ github.event.inputs.parameter_value }}
        run: echo "::add-mask::$VALUE"

      # ── 3. AWS auth (OIDC) — reuses the same role/region as ci.yml ──────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      # ── 4. Update the single key (update-existing-only) ─────────────────────
      # Inputs are passed via env (never interpolated into the shell) to avoid
      # script injection. jq --arg handles arbitrary values safely. The secret
      # JSON is never printed. Fails if the key does not already exist.
      - name: Update key in Secrets Manager
        env:
          TARGET_ENV: ${{ github.event.inputs.environment }}
          PARAM_NAME: ${{ github.event.inputs.parameter_name }}
          PARAM_VALUE: ${{ github.event.inputs.parameter_value }}
        run: |
          set -euo pipefail
          SECRET_ID="${TARGET_ENV}/${SERVICE_TOKEN}/app"
          echo "Secret: $SECRET_ID   Key: $PARAM_NAME"

          CURRENT=$(aws secretsmanager get-secret-value \
                      --secret-id "$SECRET_ID" \
                      --query SecretString --output text)

          if ! printf '%s' "$CURRENT" | jq -e --arg k "$PARAM_NAME" 'has($k)' >/dev/null; then
            echo "❌ Key '$PARAM_NAME' does not exist in $SECRET_ID."
            echo "   This workflow only updates existing keys. Add new keys via Terraform."
            exit 1
          fi

          UPDATED=$(printf '%s' "$CURRENT" \
                     | jq -c --arg k "$PARAM_NAME" --arg v "$PARAM_VALUE" '.[$k] = $v')

          aws secretsmanager put-secret-value \
            --secret-id "$SECRET_ID" \
            --secret-string "$UPDATED" \
            --no-cli-pager >/dev/null

          echo "✅ Updated '$PARAM_NAME' in $SECRET_ID"

      # ── 5. Restart the service so new tasks read the updated value ──────────
      - name: Restart ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment \
            --region  "${{ vars.AWS_REGION }}" \
            --no-cli-pager >/dev/null
          echo "🔁 Forced new deployment of ${{ vars.ECS_SERVICE }}"

      # ── 6. Wait until the new tasks are healthy and stable ──────────────────
      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster  "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --region   "${{ vars.AWS_REGION }}"
          echo "✅ Service is stable"
